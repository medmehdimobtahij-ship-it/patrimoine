<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patrimoine</title>
  <meta name="description" content="Suivi personnel du patrimoine et des dépenses">
  <meta name="theme-color" content="#F4F6F3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Patrimoine</h1>
    <div class="topbar-actions">
      <span class="live" id="live" title="Connexion…"></span>
      <button class="icon-btn" id="btn-refresh" data-act="refresh" aria-label="Actualiser"><span data-icon="refresh"></span></button>
      <button class="icon-btn" id="btn-eye" aria-label="Masquer les montants"></button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <button class="fab" id="fab" aria-label="Ajouter une opération">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <nav class="tabbar" id="tabbar">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>Patrimoine</span></div>
    <button data-tab="patrimoine"><span class="ti" data-icon="wallet"></span><span class="tl">Patrimoine</span></button>
    <button data-tab="depenses"><span class="ti" data-icon="pie"></span><span class="tl">Bilan</span></button>
    <button data-tab="claude"><span class="ti" data-icon="spark"></span><span class="tl">Claude</span></button>
    <button data-tab="operations"><span class="ti" data-icon="list"></span><span class="tl">Opérations</span><i class="badge" id="badge-todo" hidden></i></button>
    <button data-tab="reglages"><span class="ti" data-icon="gear"></span><span class="tl">Réglages</span></button>
    <button class="side-add" id="side-add" type="button"><span data-icon="plus"></span>Nouvelle opération</button>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
